name: contact_sheet
description: Every page of a Flutter app as one map, from its widget previews shot with shutter, written as HTML and JSON, and SVG when asked.
version: 0.1.0
repository: https://github.com/koji-1009/contact_sheet
issue_tracker: https://github.com/koji-1009/contact_sheet/issues
screenshots:
  - description: The map of the shop example, its pages, the transitions between them, and each page's design linked above it.
    path: doc/images/map.png
  - description: The cart of the shop example chosen, its states, and its transitions as sentences.
    path: doc/images/page.png
  - description: The tree of the trips example, 37 pages, each under the page the app's start first reaches it from.
    path: doc/images/tree.png
  - description: Code and specifications, looked into by an AI agent, become the sheet, and sheet export draws the map.
    path: doc/images/flow.png
topics:
  - flutter
  - preview
  - navigation
  - documentation
  - cli

environment:
  sdk: ^3.13.0

# A command line, run on a desktop or CI.
platforms:
  linux:
  macos:
  windows:

executables:
  sheet: contact_sheet

dependencies:
  args: ^2.7.0
  crypto: ^3.0.0
  image: ^4.12.0
  io: ^1.1.0
  path: ^1.9.0
  shutter: ^1.4.0
  stack_trace: ^1.12.2
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.16.2
  build_version: ^2.2.1
  lints: ^6.0.0
  test: ^1.26.0
  test_descriptor: ^2.0.2
  test_process: ^2.1.1
