      <path d="M0 0L10 5L0 10z" fill="#5f6672"/>
    </marker>
  </defs>
  <rect width="1200" height="220" rx="16" fill="#f6f7f9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" fill="#1b1d21">
    <g>
      <rect x="20" y="46" width="196" height="128" rx="12" fill="#ffffff" stroke="#d9dde3" stroke-width="1.5"/>
