# The transition structure of shop_app, written by an AI that read its code
# (lib/router.dart and lib/features/). Nothing in shop_app is marked for it.
# shop_app has no previews of its own: every state is the sheet package's
# (contact_sheet/lib/preview/), started through the app's router.

# What the pages read through riverpod, replaced in lib/fakes/states.dart.
dependencies:
  - name: AuthRepository
    target: authRepositoryProvider
    source: lib/data/auth_repository.dart
  - name: ProductRepository
    target: productRepositoryProvider
    source: lib/data/product_repository.dart
  - name: CartRepository
    target: cartRepositoryProvider
    source: lib/data/cart_repository.dart

# What the app keeps across its pages: signing in, and the cart, which
# starts empty. The pages that show them have a state of each value.
conditions:
  - name: Login
    values: [Guest, Signed in]
    source: lib/data/auth_repository.dart
  - name: Cart
    values: [Empty, Has items]
    source: lib/data/cart_repository.dart

# What the pages are tagged with: a page's design is at the same place for
# each, by its name.
tags:
  - name: Spec
  - name: Design
    url: https://example.com/designs/{value}

pages:
  - id: home
    label: Home
    section: Shopping
    widget: HomePage
    source: lib/features/home_page.dart
    path: /
    memo: |-
      The products. A guest can start shopping here too.
      No search or sorting yet.
    tags:
      Spec: {label: Home spec, url: https://example.com/specs/home}
      Design: home
    dependencies: [AuthRepository, ProductRepository]
    states:
      - name: Guest
        if: {Login: Guest}
        preview: contact_sheet/lib/preview/home.dart#home
        uses: {AuthRepository: guest, ProductRepository: 3 products}
      - name: Signed in
        if: {Login: Signed in}
        preview: contact_sheet/lib/preview/home.dart#home@1
        uses: {AuthRepository: signed in, ProductRepository: 3 products}

  # It looks the same signed in or not: only the router's redirect, when
  # Buy now is tapped, reads AuthRepository.
  - id: product_detail
    label: Product
    section: Shopping
    widget: ProductDetailPage
    source: lib/features/product_detail_page.dart
    path: /products/:id
    tags: {Design: product}
    dependencies: [ProductRepository, CartRepository]
    states:
      - name: Default
        preview: contact_sheet/lib/preview/product_detail.dart#productDetail
        uses: {ProductRepository: 3 products, CartRepository: empty}

  - id: cart
    label: Cart
    section: Shopping
    widget: CartPage
    source: lib/features/cart_page.dart
    path: /cart
    tags: {Design: cart}
    dependencies: [CartRepository]
    states:
      - name: Two items
        if: {Cart: Has items}
        preview: contact_sheet/lib/preview/cart.dart#cart
        uses: {CartRepository: 2 items}
      - name: Empty
        if: {Cart: Empty}
        preview: contact_sheet/lib/preview/cart.dart#cart@1
        uses: {CartRepository: empty}

  - id: checkout
    label: Checkout
    section: Shopping
    widget: CheckoutPage
    source: lib/features/checkout_page.dart
    path: /checkout
    tags: {Design: checkout}
    dependencies: [CartRepository]
    states:
      - name: Two items
        if: {Cart: Has items}
        preview: contact_sheet/lib/preview/checkout.dart#checkout
        uses: {CartRepository: 2 items}
      - name: Empty
        if: {Cart: Empty}
        preview: contact_sheet/lib/preview/checkout.dart#checkout@1
        uses: {CartRepository: empty}

  - id: complete
    label: Order complete
    section: Shopping
    widget: CompletePage
    source: lib/features/complete_page.dart
    path: /complete
    tags: {Design: complete}
    states:
      - name: Default
        preview: contact_sheet/lib/preview/complete.dart#complete

  - id: login
    label: Log in
    section: Account
    widget: LoginPage
    source: lib/features/login_page.dart
    path: /login
    tags: {Design: login}
    dependencies: [AuthRepository]
    states:
      - name: From checkout
        preview: contact_sheet/lib/preview/login.dart#login
        uses: {AuthRepository: guest}
      - name: From home
        preview: contact_sheet/lib/preview/login.dart#loginFromHome
        uses: {AuthRepository: guest}

  - id: orders
    label: Orders
    section: Account
    widget: OrdersPage
    source: lib/features/orders_page.dart
    path: /orders
    tags: {Design: orders}
    states:
      - name: Default
        preview: contact_sheet/lib/preview/orders.dart#orders

edges:
  # Each product's ListTile pushes /products/:id.
  - {from: home, to: product_detail, trigger: other:Tap a product, source: lib/features/home_page.dart}
  # The app bar's cart button: an icon, told by its tooltip.
  - {from: home, to: cart, trigger: label:Cart, source: lib/features/home_page.dart}
  # A product in the cart (CartItemTile) opens it.
  - {from: cart, to: product_detail, trigger: other:Tap a product, when: Two items, source: lib/features/cart_page.dart}
  # Check out is disabled when the cart is empty. The router's redirect
  # sends a guest to log in instead.
  - {from: cart, to: checkout, trigger: text:Check out, when: Two items, if: {Login: Signed in}, source: lib/features/cart_page.dart}
  - {from: cart, to: login, trigger: text:Check out, when: Two items, if: {Login: Guest}, then: From checkout, kind: redirect, source: lib/router.dart}
  # The Log in button is shown only to a guest.
  - {from: home, to: login, trigger: text:Log in, when: Guest, then: From home, source: lib/features/home_page.dart}
  # Buy now puts the product in the cart, then pushes /checkout; the
  # router's redirect sends a guest to /login?from=/checkout instead.
  - {from: product_detail, to: checkout, trigger: text:Buy now, if: {Login: Signed in}, set: {Cart: Has items}, source: lib/features/product_detail_page.dart}
  - {from: product_detail, to: login, trigger: text:Buy now, if: {Login: Guest}, set: {Cart: Has items}, then: From checkout, kind: redirect, source: lib/router.dart}
  # Pay, disabled when the cart is empty, empties it. Its text has the total
  # in it.
  - {from: checkout, to: complete, trigger: other:Pay, when: Two items, set: {Cart: Empty}, kind: go, source: lib/features/checkout_page.dart}
  # Logging in goes to `from`, or home without one. The app bar says
  # Log in too: the button is the one pressed.
  - {from: login, to: checkout, trigger: text:Log in, when: From checkout, set: {Login: Signed in}, kind: go, source: lib/features/login_page.dart}
  - {from: login, to: home, trigger: text:Log in, when: From home, set: {Login: Signed in}, kind: go, source: lib/features/login_page.dart}
  - {from: complete, to: home, trigger: text:Back to home, kind: go, source: lib/features/complete_page.dart}
  # pushReplacement: the history takes the completed page's place.
  - {from: complete, to: orders, trigger: text:Orders, kind: replace, source: lib/features/complete_page.dart}
  - {from: orders, to: home, trigger: text:Back to home, kind: go, source: lib/features/orders_page.dart}
  # No back is written for login: a guest sent there goes back to the page
  # under it, where Buy now or Check out was tapped (not to checkout),
  # which is the back of the redirect's push.

# Deep links, from no page of the app: a link to a product, which go_router
# takes from the platform (the app's routes).
entries:
  - {to: product_detail, via: /products/:id, source: lib/router.dart}
