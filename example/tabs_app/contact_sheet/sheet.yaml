# The transition structure of tabs_app, written by reading its code
# (lib/pages/). No router: the bottom tabs switch in place, and pages are
# pushed with Navigator.push and a MaterialPageRoute, without names.
# The tabs and the post are previews of the app's own; signing in, which
# opens as a dialog over the profile tab, is the sheet package's.

dependencies:
  - name: FeedApi
    target: Services.feed
    source: lib/services.dart
  - name: Session
    target: Services.session
    source: lib/services.dart

# Signing in is kept by the session, whichever tab is shown.
conditions:
  - name: Login
    values: [Guest, Signed in]
    source: lib/services.dart

pages:
  - id: feed
    label: Feed
    section: Tabs
    widget: FeedTab
    source: lib/pages/feed_tab.dart
    memo: "HomeShell's first tab. The tabs keep no history: switching shows another in place."
    dependencies: [FeedApi]
    states:
      - {name: Default, preview: lib/pages/home_shell_preview.dart#feedTab, uses: {FeedApi: 3 posts}}

  - id: search
    label: Search
    section: Tabs
    widget: SearchTab
    source: lib/pages/search_tab.dart
    dependencies: [FeedApi]
    states:
      - {name: Nothing typed, preview: lib/pages/home_shell_preview.dart#searchTab, uses: {FeedApi: 3 posts}}

  - id: profile
    label: Profile
    section: Tabs
    widget: ProfileTab
    source: lib/pages/profile_tab.dart
    dependencies: [Session]
    states:
      - {name: Guest, if: {Login: Guest}, preview: lib/pages/home_shell_preview.dart#profileTab, uses: {Session: guest}}
      - {name: Signed in, if: {Login: Signed in}, preview: lib/pages/home_shell_preview.dart#profileTab@1, uses: {Session: koji}}

  - id: post
    label: Post
    widget: PostPage
    source: lib/pages/post_page.dart
    states:
      - {name: Default, preview: lib/pages/post_page_preview.dart#postPage}

  - id: sign_in
    label: Sign in
    widget: SignInPage
    source: lib/pages/sign_in_page.dart
    memo: Opens from the profile as a full-screen dialog.
    dependencies: [Session]
    states:
      - {name: Default, preview: contact_sheet/lib/preview/sign_in.dart#signIn, uses: {Session: guest}}

edges:
  # The bottom tabs (HomeShell's NavigationBar): no history. Each tab from
  # the other two.
  - {from: [search, profile], to: feed, trigger: text:Feed, kind: replace, source: lib/pages/home_shell.dart}
  - {from: [feed, profile], to: search, trigger: text:Search, kind: replace, source: lib/pages/home_shell.dart}
  - {from: [feed, search], to: profile, trigger: text:Profile, kind: replace, source: lib/pages/home_shell.dart}
  # Each post's ListTile opens it.
  - {from: feed, to: post, trigger: other:Tap a post, source: lib/pages/feed_tab.dart}
  # A search result opens its post too.
  - {from: search, to: post, trigger: other:Tap a search result, source: lib/pages/search_tab.dart}
  - {from: profile, to: sign_in, trigger: text:Sign in, when: Guest, source: lib/pages/profile_tab.dart}
  - {from: sign_in, to: profile, trigger: text:Sign in, set: {Login: Signed in}, kind: pop, source: lib/pages/sign_in_page.dart}
  # Signing out is done in place (setState): the profile shows signed out.
  - {from: profile, to: profile, trigger: text:Sign out, when: Signed in, set: {Login: Guest}, kind: replace, source: lib/pages/profile_tab.dart}
