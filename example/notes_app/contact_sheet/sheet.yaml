# The transition structure of notes_app, written by reading its code
# (lib/routes.dart and lib/pages/). Navigator 1.0: named routes, a note's id
# as the route's argument. Every state is a preview of the app's own
# (lib/pages/*_preview.dart): there is no sheet package.

# Each page is shot as an iPhone, as Android, and as the app's own Devices
# MultiPreview gives its Tablet preview (lib/previews/devices.dart).
variants:
  - {name: iPhone}
  - {name: Android, platform: android}
  - {name: Tablet, preview: Tablet}

dependencies:
  - name: NotesApi
    target: NotesScope (NotesStore)
    source: lib/data/notes.dart

pages:
  - id: notes
    label: Notes
    widget: NotesPage
    source: lib/pages/notes_page.dart
    path: /
    dependencies: [NotesApi]
    states:
      - {name: Three notes, preview: lib/pages/notes_page_preview.dart#notesPage, uses: {NotesApi: 3 notes}}
      # What the API gives decides these, not the arrow.
      - {name: Empty, preview: lib/pages/notes_page_preview.dart#notesPage@1, uses: {NotesApi: 0 notes}, data: true}
      - {name: Loading, preview: lib/pages/notes_page_preview.dart#notesPage@2, uses: {NotesApi: waiting}, data: true}

  - id: note
    label: Note
    widget: NotePage
    source: lib/pages/note_page.dart
    path: /note
    dependencies: [NotesApi]
    states:
      - {name: Default, preview: lib/pages/note_page_preview.dart#notePage, uses: {NotesApi: 3 notes}}

  - id: edit
    label: Edit
    widget: EditPage
    source: lib/pages/edit_page.dart
    path: /edit
    memo: A new note opens as a full-screen dialog (/edit without an id).
    dependencies: [NotesApi]
    states:
      - {name: New, preview: lib/pages/edit_page_preview.dart#newNote, uses: {NotesApi: 3 notes}}
      - {name: Existing, preview: lib/pages/edit_page_preview.dart#editNote, uses: {NotesApi: 3 notes}}

  - id: settings
    label: Settings
    widget: SettingsPage
    source: lib/pages/settings_page.dart
    path: /settings
    states:
      - {name: Default, preview: lib/pages/settings_page_preview.dart#settingsPage}

edges:
  # Each note's ListTile opens it.
  - {from: notes, to: note, trigger: other:Tap a note, when: Three notes, source: lib/pages/notes_page.dart}
  # /edit without an argument is a new note; with the note's id, that note.
  - {from: notes, to: edit, trigger: label:New note, then: New, source: lib/pages/notes_page.dart}
  - {from: notes, to: settings, trigger: label:Settings, source: lib/pages/notes_page.dart}
  - {from: note, to: edit, trigger: label:Edit, then: Existing, source: lib/pages/note_page.dart}
  # Deleting pops back to the list.
  - {from: note, to: notes, trigger: label:Delete, kind: pop, source: lib/pages/note_page.dart}
  # Saving pops back to where the editor was opened from.
  - {from: edit, to: notes, trigger: text:Save, when: New, kind: pop, source: lib/pages/edit_page.dart}
  - {from: edit, to: note, trigger: text:Save, when: Existing, kind: pop, source: lib/pages/edit_page.dart}
